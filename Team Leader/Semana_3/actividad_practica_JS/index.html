<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practica JS</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>
    <body>

        <button onclick="cambiarDanger()">Cambiar a danger</button>
        <button onclick="cambiarSucces()">Cambiar a success</button>
        <br>


        <button id="boton_1" class="btn btn-primary">Nice</button>


        <div class="container">
            <div class="col">
                <div class="row">
                    <div class="col-md-4 offset-md-4">
                        <div class="card- mt-3">
                            <div class="card body">
                                <form action="">
                                    <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu nombre">
                                    <br>
                                    <input type="text" id="apellido" class="form-control" placeholder="Ingresa tu apellido">
                                    <br>
                                    <input type="email" id="correo" class="form-control" placeholder="Ingresa tu correo">
                                    <br>
                                    <input type="tel" id="celular" class="form-control" placeholder="Ingresa tu celular">
                                    <br>
                                    <input type="text" id="direccion" class="form-control" placeholder="Ingresa tu direccion">
                                    <br>
                                    <button onclick="enviar_nombre()" class="btn btn-primary mt-2" type="button">Enviar</button>
                                </form>
                            </div>
                        </div>

                        <div class="mt-3">
                            <div class="card-body">
                                <p>Bienvenido:
                                    <br>
                                    <span id="tu_nombre"></span>
                                    <br>
                                    <span id="tu_apellido"></span>
                                    <br>
                                    <span id="tu_correo"></span>
                                    <br>
                                    <span id="tu_celular"></span>
                                    <br>
                                    <span id="tu_direccion"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
